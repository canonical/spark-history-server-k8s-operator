name: Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  schedule:
    - cron: "53 0 * * *" # Daily at 00:53 UTC
  # Triggered on push to branch "main" by .github/workflows/release.yaml
  workflow_call:
    outputs:
      artifact-prefix:
        description: build_charm.yaml `artifact-prefix` output
        value: ${{ jobs.build.outputs.artifact-prefix }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install tox
        run: pipx install tox
      - name: Run linters
        run: tox run -e lint

  unit-test:
    name: Unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install tox
        run: pipx install tox
      - name: Run tests
        run: tox run -e format
      - name: Run tests
        run: tox run -e unit

  build:
    name: Build charms
    uses: canonical/data-platform-workflows/.github/workflows/build_charm.yaml@v37.0.1

  integration-test:
    strategy:
      fail-fast: false
      matrix:
        tox-environments:
          - integration-charm
          - integration-tls
          - integration-azure
          - integration-logs
        runner:
          - ubuntu-22.04
          - [self-hosted, linux, AMD64, X64, large, jammy]
        exclude:
          - tox-environments: integration-azure # Don't test azure twice
            runner: [self-hosted, linux, AMD64, X64, large, jammy]
          - tox-environments: integration-charm # Don't test charm twice
            runner: [self-hosted, linux, AMD64, X64, large, jammy]

    name: ${{ matrix.tox-environments }}
    needs:
      - lint
      - unit-test
      - build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Java
        # Necessary to get keytool
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "8"
      - name: Setup operator environment
        uses: charmed-kubernetes/actions-operator@main
        with:
          juju-channel: 3.6/stable
          provider: microk8s
          channel: 1.32-strict/stable
          microk8s-group: snap_microk8s
          microk8s-addons: "hostpath-storage dns metallb:10.64.140.43-10.64.140.49"
      - name: Setup microceph by action
        id: microceph-action
        if: ${{ matrix.tox-environments == 'integration-tls' }}
        uses: canonical/microceph-action@v0.2
        with:
          channel: "latest/edge"
          accesskey: "accesskey"
          secretkey: "secretkey"
          bucket: "testbucket"
          osdsize: "3G"
      - name: Setup microceph by hand
        id: microceph-manual
        if: ${{ matrix.tox-environments != 'integration-tls' }}
        run: |
          sudo snap install microceph
          sudo microceph cluster bootstrap
          sudo microceph disk add loop,1G,3
          sudo microceph enable rgw
          sudo microceph.radosgw-admin user create --uid test --display-name test --access-key=foo --secret-key=bar
          echo -e "S3_SERVER_URL=http://$(ip -4 -j route get 2.2.2.2 | jq -r '.[] | .prefsrc'):80/\nS3_ACCESS_KEY=foo\nS3_SECRET_KEY=bar" > .env
      - name: Setup Azure CLI
        id: Azure
        run: |
          sudo snap install azcli
      - name: Download packed charm(s)
        uses: actions/download-artifact@v6
        with:
          artifact-prefix: ${{ needs.build.outputs.artifact-prefix }}
          merge-multiple: true
      - name: Select tests
        id: select-tests
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]
          then
            echo Running unstable and stable tests
            echo "mark_expression=" >> $GITHUB_OUTPUT
          else
            echo Skipping unstable tests
            echo "mark_expression=not unstable" >> $GITHUB_OUTPUT
          fi
      - name: Run integration tests
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          CI_PACKED_CHARMS: ${{ needs.build.outputs.charms }}
        run: |
          tox run -e ${{ matrix.tox-environments }} -- -m '${{ steps.select-tests.outputs.mark_expression }}'
