[tool.poetry]
package-mode = false
requires-poetry = ">=2.0.0"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
ops = "^3.4.0"
pydantic = "^1.10.24"
pyyaml = ">=6.0.3"
boto3 = "^1.42.0"
jsonschema = "^4.25.1"
tenacity = ">=9.1.2"
azure-storage-blob = "^12.27.1"

[tool.poetry.group.charm-libs.dependencies]
ops = "^3.0.0"
poetry-core = "*"
# grafana_agent/v0/cos_agent.py requires pydantic <2
# traefix_k8s/v2/ingress.py
pydantic = "^1.10.17, <2"
# grafana_agent/v0/cos_agent.py
# loki_k8s/v1/loki_push_api.py
# prometheus_k8s/v0/prometheus_scrape.py
pyyaml = "*"
# oauth2_proxy_k8s/v0/auth_proxy.py
jsonschema = "*"
# loki_k8s/v1/loki_push_api.py
# prometheus_k8s/v0/prometheus_scrape.py
cosl = "*"

[tool.poetry.group.format]
optional = true

[tool.poetry.group.format.dependencies]
ruff = ">=0.14.7"

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
ruff = ">=0.14.7"
codespell = ">=2.4.1"
mypy = "^1.17.1"
boto3-stubs = { extras = ["s3"], version = "^1.42.0" }
types-pyyaml = "^6.0.12.20250915"
types-requests = "^2.32.4.20260107"

[tool.poetry.group.unit]
optional = true

[tool.poetry.group.unit.dependencies]
pytest = "^9.0.0"
coverage = { extras = ["toml"], version = ">7.0" }
ops = { version = "^3.4.0", extras = ["testing"] }
moto = { extras = ["s3"], version = "^5.1.18" }

[tool.poetry.group.integration]
optional = true

[tool.poetry.group.integration.dependencies]
pytest = "^9.0.0"
coverage = { extras = ["toml"], version = ">7.0" }
tenacity = "^9.1.2"
jubilant = "^1.6.1"
python-dotenv = "^1.2.1"
pytest-asyncio = "^1.3.0"
pytest-playwright = "*"
lightkube = "^0.18.0"
jinja2 = "*"

[tool.ruff]
line-length = 99
extend-exclude = ["__pycache__", "*.egg_info"]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "C", "N", "D", "I001"]
extend-ignore = [
  "D203",
  "D204",
  "D213",
  "D215",
  "D400",
  "D401",
  "D404",
  "D406",
  "D407",
  "D408",
  "D409",
  "D413",
]
ignore = ["E501", "D107"]
per-file-ignores = { "tests/*" = ["D100", "D101", "D102", "D103", "D104", "E999"], "src/literals.py" = ["D101"], "src/*/__init__.py" = ["D104"] }
mccabe.max-complexity = 10

[tool.mypy]
exclude = [
  "lib",
]
follow_imports = "silent"

[[tool.mypy.overrides]]
module = [
  "charms.data_platform_libs.*",
  "charms.grafana_k8s.*",
  "charms.loki_k8s.*",
  "charms.prometheus_k8s.*",
  "charms.tls_certificates_interface.*",
  "charms.oauth2_proxy_k8s.*",
  "charms.oathkeeper.*",
  "charms.traefik_k8s.*",
]
ignore_missing_imports = true

# Testing tools configuration
[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"
asyncio_mode = "auto"
markers = ["unstable"]

[tool.pyright]
include = ["src"]
extraPaths = ["./lib", "src"]
pythonVersion = "3.10"
pythonPlatform = "All"
