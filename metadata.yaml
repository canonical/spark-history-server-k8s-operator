name: spark-history-server-k8s
display-name: Spark History Server
summary: Kubernetes based charm for Spark History Server.
description: |
  Apache Spark is a multi-language engine for executing data engineering,
  data science, and machine learning on single-node machines or clusters.
  History Server is a Spark component that allows the users to view and
  analyze their completed Spark application logs.

  This charm packages Apache Spark's History Server for Kubernetes environments.

  Apache Spark is a free, open source software project by the Apache Software Foundation.
  Users can find out more at the [Spark project page](https://spark.apache.org/).
docs: https://canonical-charmed-spark.readthedocs-hosted.com/main/how-to/spark-history-server
source: https://github.com/canonical/spark-history-server-k8s-operator
issues: https://github.com/canonical/spark-history-server-k8s-operator/issues
website:
  - https://ubuntu.com/data/spark
  - https://charmhub.io/spark-k8s-bundle
  - https://github.com/canonical/spark-history-server-k8s-operator
  - https://matrix.to/#/%23charmhub-analytics%3Aubuntu.com
maintainers:
  - Canonical Data Platform <data-platform@lists.launchpad.net>

containers:
  spark-history-server:
    resource: spark-history-server-image

resources:
  spark-history-server-image:
    type: oci-image
    description: OCI image for Spark History Server
    # oci-tag=3.5-22.04_edge
    upstream-source: ghcr.io/canonical/charmed-spark@sha256:be8a6f6147cbb73f9fe8bb56c6df87d89d3bd8ae95d07b939f3e23de1c75a6a5

requires:
  s3-credentials:
    interface: s3
    optional: true
  azure-storage-credentials:
    interface: azure_storage
    optional: true
  ingress:
    interface: ingress
    limit: 1
    optional: true
  auth-proxy:
    interface: auth_proxy
    limit: 1
    optional: true
  oauth2-proxy:
    interface: auth_proxy
    limit: 1
    optional: true
  logging:
    interface: loki_push_api
    description: |
      Receives Loki's push api endpoint address to push logs to, and forwards charm's built-in alert rules to Loki.
    optional: true
  service-mesh:
    limit: 1
    interface: service_mesh
    description: |
      Integrate this charm into a service mesh
  require-cmr-mesh:
    interface: cross_model_mesh
    description: |
      If this app relates to other applications on a charmed service mesh cross-model, use this relation to send that related app additional data needed to automatically generate traffic authorization policies.  This is required because Juju does not natively provide all information required to build these policies when related cross-model.


provides:
  metrics-endpoint:
    interface: prometheus_scrape
    optional: true
  grafana-dashboard:
    interface: grafana_dashboard
    optional: true
  provide-cmr-mesh:
    interface: cross_model_mesh
    description: |
      If this app is generating policies to provide access to related applications that are cross-model, relate that app to this additional relation to retrieve additional data required for these policies.  This is required because Juju does not natively provide all information required to build these policies when related cross-model.
