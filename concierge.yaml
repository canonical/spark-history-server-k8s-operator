juju:
  model-defaults:
    logging-config: <root>=INFO; unit=DEBUG

providers:
  k8s:
    enable: true
    bootstrap: true
    channel: 1.32-classic/stable
    features:
      load-balancer:
        enabled: true
        l2-mode: true
        cidrs: 10.64.0.0/16
      local-storage:
      network:
      dns:
    bootstrap-constraints:
      root-disk: 4G

host:
  packages:
    - jq
    - pipx
    - s3cmd
  snaps:
    charmcraft:
      channel: latest/stable
    kubectl:
      channel: latest/stable
    microceph:
      channel: squid/stable
    rockcraft:
      channel: latest/stable
    spark-client:
      channel: 3.5/edge
